# Local Development Stack for FRC Challenge Site
# Includes: LocalStack (DynamoDB) + Challenge Runtime Container
#
# Usage:
#   npm run local          # Start containers + Lambda API
#   npm run local:stop     # Stop containers

services:
  # LocalStack for AWS service emulation (DynamoDB, S3, etc.)
  localstack:
    image: localstack/localstack:latest
    container_name: frc-challenge-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,s3
      - DEBUG=0
      - PERSISTENCE=1
      - DATA_DIR=/var/lib/localstack/data
      - DEFAULT_REGION=us-east-2
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Initialize LocalStack with DynamoDB tables
  localstack-init:
    image: amazon/aws-cli:latest
    container_name: frc-challenge-localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Creating DynamoDB tables..."

        # Challenges table
        aws --endpoint-url=http://localstack:4566 dynamodb create-table \
          --table-name frc-challenge-api-challenges-dev \
          --attribute-definitions AttributeName=id,AttributeType=S AttributeName=category,AttributeType=S AttributeName=difficulty,AttributeType=S AttributeName=githubUrl,AttributeType=S \
          --key-schema AttributeName=id,KeyType=HASH \
          --global-secondary-indexes '[{"IndexName":"CategoryIndex","KeySchema":[{"AttributeName":"category","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}},{"IndexName":"DifficultyIndex","KeySchema":[{"AttributeName":"difficulty","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}},{"IndexName":"GitHubUrlIndex","KeySchema":[{"AttributeName":"githubUrl","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}]' \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || echo "Table already exists"

        # User Progress table
        aws --endpoint-url=http://localstack:4566 dynamodb create-table \
          --table-name frc-challenge-api-user-progress-dev \
          --attribute-definitions AttributeName=userId,AttributeType=S AttributeName=challengeId,AttributeType=S \
          --key-schema AttributeName=userId,KeyType=HASH AttributeName=challengeId,KeyType=RANGE \
          --global-secondary-indexes '[{"IndexName":"ChallengeIndex","KeySchema":[{"AttributeName":"challengeId","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}]' \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || echo "Table already exists"

        # Challenge Sessions table
        aws --endpoint-url=http://localstack:4566 dynamodb create-table \
          --table-name frc-challenge-api-challenge-sessions-dev \
          --attribute-definitions AttributeName=sessionId,AttributeType=S AttributeName=userId,AttributeType=S AttributeName=challengeId,AttributeType=S \
          --key-schema AttributeName=sessionId,KeyType=HASH \
          --global-secondary-indexes '[{"IndexName":"UserIndex","KeySchema":[{"AttributeName":"userId","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}},{"IndexName":"ChallengeIndex","KeySchema":[{"AttributeName":"challengeId","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}]' \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || echo "Table already exists"

        echo "DynamoDB tables ready!"
        aws --endpoint-url=http://localstack:4566 dynamodb list-tables

  # Challenge Runtime Container (same as production but running locally)
  challenge-runtime:
    build:
      context: ../frc-challenge-site/docker
      dockerfile: ./Dockerfile
    container_name: frc-challenge-runtime-local
    ports:
      - "30003:30003"  # Main HTTP server (Monaco editor, file operations)
      - "30004:30004"  # NT4 WebSocket proxy
      - "30005:30005"  # HALSim WebSocket proxy
      - "30006:30006"  # JDTLS Language Server WebSocket
      - "5901:5901"    # VNC (optional, for debugging)
      - "6901:6901"    # noVNC web client (optional)
      - "3300:3300"    # HAL Simulation WebSocket port
    environment:
      - JAVA_OPTS=-Xmx2g
      - NODE_ENV=development
      - SESSION_ID=local-dev-session
      - USER_ID=local-dev-user-123
      - CHALLENGE_ID=local-challenge
    depends_on:
      localstack-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  localstack-data:
    driver: local

